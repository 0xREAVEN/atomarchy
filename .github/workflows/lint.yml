name: lint

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            {
              find build_files tests iso .github/scripts -name '*.sh'
              find system_files -path '*/libexec/atomarchy/*' -type f
              find system_files -path '*/share/atomarchy/bin/*' -type f
            } | sort -u
          )
          printf '%s\n' "${scripts[@]}"
          shellcheck --version
          shellcheck --external-sources --source-path=SCRIPTDIR --source-path=. --severity=warning "${scripts[@]}"

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Containerfile
          # DL3006: base images are pinned by tag on purpose (daily rebuilds).
          ignore: DL3006
      - name: hadolint (installer)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: iso/Containerfile
          ignore: DL3006,DL3041

  just:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: just --fmt --check
        run: |
          set -euo pipefail
          for file in $(find system_files -name '*.just') Justfile; do
            echo "$file"
            just --unstable --fmt --check --justfile "$file"
          done

  pkgdiff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: pkgdiff.py self-test
        run: |
          printf 'a.x86_64\t0:1-1\nb.noarch\t0:2-1\n' >old.txt
          printf 'b.noarch\t0:2-2\nc.x86_64\t1:3-1\n' >new.txt
          python3 .github/scripts/pkgdiff.py old.txt new.txt test | tee out.md
          grep -q '1 added, 1 removed, 1 changed' out.md
