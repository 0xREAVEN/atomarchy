# Atomarchy Gaming kernel tunables. Named to sort after Omarchy's
# 99-omarchy-sysctl.conf, so these values win.
#
# Inherited from Bazzite (github.com/ublue-os/bazzite, Apache 2.0)
vm.max_map_count = 2147483642
kernel.split_lock_mitigate = 0
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1

# From Bazzora: use the zram swap more readily, write dirty pages in smaller
# batches, pace network packets. Not benchmarked: preferences, not claims.
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
net.core.netdev_max_backlog = 4096
net.core.default_qdisc = fq
