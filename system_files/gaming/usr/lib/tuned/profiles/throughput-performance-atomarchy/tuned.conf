#
# tuned configuration
#
# "Performance" power profile of Atomarchy Gaming: throughput-performance
# without its dirty_ratio = 40 % of RAM, which would override the write-back
# limits of 99-zz-atomarchy-gaming.conf. Mapped to the performance mode of
# power-profiles by build_files/gaming/30-tuning.sh (/etc/tuned/ppd.conf).

[main]
summary=Throughput performance keeping Atomarchy disk write-back limits
include=throughput-performance

[vm]
dirty_bytes=268435456
dirty_background_bytes=67108864
